<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Шифр Цезаря</title>
  <style>
    *{ font-family: "Manrope_Cut_008 Medium",sans-serif; }
    body { font-family: "Manrope_Cut_008 ExtraBold", sans-serif; margin: 40px; }
    .container { max-width: 600px; margin: 0 auto; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; }
    input { width: 96% }
    button { background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
    .error { color: red; }
  </style>
</head>
<body>
<div class="container">
  <h1>Шифр Цезаря</h1>

  <form method="post" action="/process" enctype="multipart/form-data">
    <div class="form-group">
      <label for="file">Выберите .txt файл:</label>
      <input type="file" id="file" name="file" accept=".txt" required>
    </div>

    <div class="form-group">
      <label for="language">Язык:</label>
      <select id="language" name="language" required>
        <option value="english">English</option>
        <option value="russian">Русский</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mode">Режим:</label>
      <select id="mode" name="mode" required>
        <option value="encryption">Шифрование</option>
        <option value="decryption">Дешифрование</option>
      </select>
    </div>

    <div class="form-group">
      <label for="key">Ключ (сдвиг):</label>
      <input type="number" id="key" name="key"
             min="1" max="25" value="1" required>
      <small>Максимальное значение: <span id="maxKey">25</span></small>
    </div>

    <button type="submit">Выполнить</button>
  </form>
</div>

<script>
  document.getElementById('language').addEventListener('change', function() {
    const maxValue = this.value === 'russian' ? 32 : 25;
    document.getElementById('key').max = maxValue;
    document.getElementById('maxKey').textContent = maxValue;

    if (document.getElementById('key').value > maxValue) {
      document.getElementById('key').value = maxValue;
    }
  });

  document.getElementById('key').addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '');

    const maxValue = parseInt(this.max);
    const currentValue = parseInt(this.value) || 0;

    if (currentValue > maxValue) {
      this.value = maxValue;
    }

    document.getElementById('maxKey').textContent = maxValue;
  });
</script>
</body>
</html>
